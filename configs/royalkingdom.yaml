# Royal Kingdom (gg.com.dreamgames.royalkingdom) — levelscope 설정
#
# 레벨이 FlatBuffers 바이너리로 들어 있다. 이름이 `1`~`4500` 인 TextAsset 4,500개.
# .fbs 스키마가 없어서 필드는 슬롯 번호(f0·f1…)로 나오고, 의미는 플러그인
# (levelscope/plugins/royalkingdom.py)의 주석에 근거와 함께 적어 두었다.
#
# 입력은 APKS 래퍼다 — 바깥 apk 안에 assets/apks/*.apk 가 들어 있고 레벨은
# UnityDataAssetPack.apk 의 datapack.unity3d 에 있다. 컨테이너가 알아서 훑는다.

game: RoyalKingdom

input:
  unity:
    data_file: assets/bin/Data/datapack.unity3d
    type: TextAsset
    name_pattern: "[0-9]+"        # 순수 숫자 이름만 = 레벨 (4,500개)

codec: [flatbuffers]

# 슬롯 타입을 표본 전체로 확정한다. FlatBuffers는 타입을 안 적어두기 때문에
# 버퍼 하나만 보면 스칼라와 오프셋이 헷갈린다(전수 검증에서 683개 오차).

flatbuffers:
  infer_schema: true

plugin: royalkingdom

fields:
  scalars: {}      # 전 컬럼을 플러그인 level_extras 에서 생성
  counts: {}

summary:
  category_col: mode
  avg_cols: [moves, cell_count, gimmick_kinds, gimmick_cells, battle_waves]

viewer:
  title: Royal Kingdom 레벨 뷰어
  subtitle: FlatBuffers 레벨 4,500개 · 기믹 원본 이미지로 렌더 · 스키마 없이 복원
  render: tiles                 # 셀을 게임 원본 기믹 이미지로 그린다
  icon_dir: icons/royalkingdom
  tile_type_pattern: "type{}"   # 타입 N → icons/royalkingdom/typeN.png
  tile_span: 1                  # 셀 1칸 = 1유닛 (겹침 없는 단층 보드)
  tile_px: 22
  tile_px_modal: 44
  card_px: [210, 200]
  modal_px: [560, 680]
  tile_inset: 0.06
  queue_title: 기믹 구성
  queue_hint: 이 레벨에 배치된 기믹 종류와 칸 수 · 이름은 게임 내부 TiledId 값
  difficulty_field: mode          # 전투/일반 필터
  difficulty_order: [일반, 전투]
  card_stats: [name, mode, moves, grid_w, grid_h, cell_count, gimmick_kinds,
               cover_cells, covers, fill_cells, gimmicks,
               battle_waves, battle_grid, battle_units]
  stat_labels: {name: 레벨명, moves: 이동수, grid_w: 가로, grid_h: 세로,
                cell_count: 셀수, cell_kinds: 셀종류, empty_cells: 빈칸,
                gimmick_kinds: 기믹종류, gimmick_cells: 기믹칸, gimmicks: 주요기믹,
                f3_entries: f3항목, f3_f0_max: f3_f0최대, f3_f1_span: f3_f1폭,
                cover_cells: 덮개칸, cover_kinds: 덮개종류, covers: 주요덮개,
                fill_cells: 빈통로칸,
                mode: 모드, battle_waves: 전투단계, battle_grid: 전투보드,
                battle_kinds: 전투요소종류, battle_units: 주요전투요소}
  badges: {}
  labels: {}

# 셀 타입 0~31 구분용 순차 팔레트 (0=빈칸 회색)

palette:
  source: static
  static: ["#2B2B2B","#E8443A","#E8763A","#E8A93A","#D9E83A","#A6E83A","#72E83A","#3AE84B",
           "#3AE87E","#3AE8B1","#3AE8E4","#3AB1E8","#3A7EE8","#3A4BE8","#4B3AE8","#7E3AE8",
           "#B13AE8","#E43AE8","#E83AB1","#E83A7E","#E83A4B","#F0846B","#F0A96B","#F0CE6B",
           "#D7F06B","#A9F06B","#6BF084","#6BF0CE","#6BCEF0","#6B84F0","#A96BF0","#CE6BF0"]

notes:
  - "주: 레벨 데이터는 FlatBuffers 바이너리. .fbs 스키마가 없어 필드명은 슬롯 번호다."
  - "확인됨: 셀 벡터 길이 = 가로×세로 가 4,500개 전부에서 일치 (보드 매핑 근거)."
  - "확인됨: f0 = 레벨명 문자열이며 파일 번호와 1:1 (0001v01_E … 4500v01_E)."
  - "추정: f1 = 이동 수 (22~31 분포). 게임 내 표기와 대조 전이므로 확정 아님."
  - "확인됨: 셀 타입 = 게임 내부 TiledId 열거형. 4,500레벨에 쓰인 178종 전부 이름이 붙었다(미상 0)."
  - "주: 기믹 이미지는 이름으로 찾아 붙인 것이라 일부 타입은 이미지가 없다. 이름은 확정값."
  - "미확정: f3(테이블 벡터)는 구조만 복원. (f0,f1) 격자에 타입값이 붙는데 의미는 확인 못 함."
  - "확인됨: 레벨 번호가 5의 배수(끝자리 5·0)면 일반 매치3가 아니라 전투 퍼즐이다."
  - "근거: 전투 전용 슬롯 f7 보유 900개 == 5의 배수 900개 로 완전히 일치."
  - "전투 레벨은 셀수 62.0 / 기믹종류 0.77, 일반은 103.3 / 8.35 로 성격이 다르다."
  - "전투 보드는 단계(웨이브) 1~3개이며 9×10 또는 8×10. 타일은 AttackTiledId 라는 다른 열거형을 쓴다."
  - "뷰어 모달의 레이어 슬라이더로 전투 단계를 벗겨 볼 수 있다."
  - "확인됨: 보드는 세 층이다 — 바텀(타일형 기믹·미션) / 노멀(상자류) / 커버(맨 위, 아래를 다 덮음)."
  - "  바텀 = f2.f1 의 f3 얼음·f9 테두리·f11 모자이크. 노멀 = f2.f0 셀 벡터. 커버 = f5 담쟁이·f7 사슬."
  - "  근거: 9스테이지 화면에서 아래 세 줄이 나무 상자로 보이는데 그 칸은 노멀 Box2 + 얼음이다."
  - "  상자가 보이니 얼음이 아래(바텀)다. 얼음은 담쟁이 663칸·사슬 397칸과 겹쳐 나와 다른 층이 맞다."
  - "확인됨: 바텀 31,503칸(얼음 17,370 · 테두리 10,159 · 모자이크 3,949 · 퍼즐 18 · 얼음1 7)."
  - "확인됨: 커버 15,195칸(담쟁이 11,627 · 사슬1 2,528 · 사슬2 1,040)."
  - "확인됨: 슬롯마다 기믹이 딱 갈린다. 나머지 슬롯(f0·f1·f2·f4·f6·f10·f12)은 1~5 파라미터라 타일이 아니다."
  - "확인됨: f2.f0 = 바닥 칸, f2.f1 = 칸별 기믹 테이블."
  - "근거: 7스테이지 실제 화면 목표 '담쟁이 72' == Lv7 의 f2.f1 비어있지 않은 칸 72개(전부 Ivy1)."
  - "덮개는 얼음·담쟁이·테두리·모자이크·사슬. 4,500 전 레벨에 걸쳐 합계 44,879칸."
  - "  (얼음 16,667 · 담쟁이 11,627 · 테두리 9,735 · 모자이크 3,694 · 사슬 3,131)"
  - "확인됨: 9스테이지 실제 화면 목표 '상자 27 · 얼음 27 · 담쟁이 36' 이 데이터와 정확히 일치."
  - "  이동 30도 일치. 6·12스테이지에서 보고된 '처음 보는 기믹'은 아이콘 오배정이었다."
  - "확정: Box1~3 = Items-BoxItem-box(나무 상자), Ice1~2 = Ice_big(연한 파랑 사각)."
  - "  이전엔 남색 사각형·하늘 그라데이션 띠가 붙어 있어 화면과 전혀 달랐다."
  - "미확정: Box1/2/3 의 차이(내구도 추정)는 그림으로 구분하지 않는다. 셋 다 같은 상자."
  - "미확정: Border(139)는 원본 스프라이트가 28x1 선뿐이라 아이콘을 붙이지 않았다."
  - "확인됨: 다중칸 기믹은 열거형 이름 끝에 칸 위치가 적혀 있다(앞=행 TMB, 뒤=열 LMR)."
  - "  원본을 행x열로 잘라 각 칸에 제 조각을 준다 — 예전엔 칸마다 전체를 그려 2x2가 4개로 보였다."
  - "  tools/build_icons_royalkingdom.py 가 생성한다. 12종 70개 조각."
  - "확인됨: 44스테이지 실제 화면 목표 '무지개 구슬 16' == MagicOrb 계열 셀 16(커튼 12 + 색 4)."
  - "  이동 31도 일치. 커튼은 MagicOrb_big, 성궤 상자는 ChaliceBox_big 이다."
  - "주: MagicOrb 는 열거형 이름이 갈려 있다 — 세 칸은 MagicOrbCurtain*, 한 칸은 <색>MagicOrbBL."
  - "미확정: <색>MagicOrbBL 의 색 구분은 그림으로 드러내지 않는다(색별 원본을 못 찾음)."
  - "미확정: Clock·Knight·Lightbulb·SteamBomb 는 원본을 못 찾아 아이콘이 없다."
  - "주: 전체 448,889칸 중 7.44%(33,418칸)가 아직 아이콘 없이 타입 번호로 나온다."
  - "뷰어에서 덮개는 바닥 위 레이어로 그려지며 슬라이더로 벗겨 바닥을 볼 수 있다."
  - "확인됨: Fill 계열은 화면에 아무것도 안 그려지는 빈 통로다. 장애물이 아니다."
  - "근거: Lv151 실제 화면에서 3행(None)과 7행(Fill)이 똑같은 빈 틈으로 보인다."
  - "  같은 화면의 과녁 72개·이동 25도 데이터와 일치해 레벨 특정이 확실하다."
  - "생성: levelscope 파이프라인"

outputs: [xlsx, html, zip]

sprites:
  sources: auto
  types: [Sprite, Texture2D]
  max_count: 40000
  categorize: true
  # 규칙 근거: CLAUDE.md 의 `Items-<이름>-*` / `<이름>_parts-*` / `<이름>_big` 규칙과
  # 실제 이름 6,826개의 앞부분 빈도. `d1`·`k1`·`pb` 처럼 뜻을 모르는 접두어는
  # 분류하지 않는다 — 틀린 이름을 붙이는 건 안 붙이는 것보다 나쁘다.
  categories:
    - name: 기믹
      match: ["re:^items[-_]", "re:^parts[-_]", "re:_parts[-_]", "re:_big$"]
    - name: 팀
      match: ["re:^teamlogo", "re:^team[-_]"]

    # ↓ 옆 세션의 표본 육안 판정 (기타_판독 문서) + 이 세션의 재확인
    - name: 이펙트
      match: ['re:^add[_-]', 're:^additive[_-]']
    # 이름에 Environment 가 그대로 있고, 잔디·바위·강이 그려진 맵 조각이다
    - name: 배경
      match: ['re:^k\d+[_-]']
    # 금색 난간·기둥·받침대·카펫 = 맵 장식. light-* 는 물가 지형 조각이라
    # 여기 둔다 — 옆 세션은 텍스처로 봤지만, 텍스처는 노이즈·베이스컬러 같은
    # 셰이더 맵 자리이고 이건 맵에 깔리는 물 표면이다(표본 직접 확인).
    - name: 환경
      match: ['re:^d\d+[_-]', 're:^p[_-]', 're:^pebbles', 're:^stones',
              're:^light[_-]']
    - name: 기믹
      match: ['re:^dragon']